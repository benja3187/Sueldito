<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#24174F">
<title>Sueldito</title>
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}[hidden]{display:none!important}</style>




<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una pantalla; contenido con scroll, barra de pestañas abajo, hojas inferiores para editar. */
:root{
  --bg:#F6F5FA; --surf:#FFFFFF; --surf2:#EFECF5; --border:#E3DFEC; --border2:#D8D2E6;
  --ink:#17141F; --muted:#5F5A6B; --purple:#6A3DD1; --purple-line:#A58BE8; --tint:#EFE8FD;
  --green:#0B7F57; --green-tint:#E2F4EC; --btn:#6A3DD1; --btn-ink:#FFFFFF;
  --hero:#24174F; --hero-ink:#FFFFFF; --hero-muted:#C9C0EA; --hero-green:#5BE0A6; --hero-purple:#B79CFF;
  --warn:#8A5200; --warn-tint:#FBF0DC; --danger:#B3261E; --danger-tint:#FBE9E7;
  --seg-base:#B8B2C6; --seg-n:#6A3DD1; --seg-nd:#24174F; --seg-d:#A58BE8; --seg-x:#0B7F57;
  --shadow:0 8px 24px rgba(36,23,79,.18);
  --display:'Space Grotesk','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E0C14; --surf:#1A1724; --surf2:#242033; --border:#2F2A40; --border2:#3A3450;
  --ink:#F3F1F8; --muted:#A9A3B8; --purple:#B49BFF; --purple-line:#6E58B8; --tint:#2A2240;
  --green:#52D69F; --green-tint:#17302A; --btn:#7447E8; --btn-ink:#FFFFFF;
  --hero:#231A47; --hero-ink:#FFFFFF; --hero-muted:#C9C0EA; --hero-green:#5BE0A6; --hero-purple:#B79CFF;
  --warn:#E8AE52; --warn-tint:#33280F; --danger:#FF8A80; --danger-tint:#3A1A18;
  --seg-base:#5A546B; --seg-n:#8F6BE8; --seg-nd:#D9CCFF; --seg-d:#5B45A0; --seg-x:#52D69F;
  --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E0C14; --surf:#1A1724; --surf2:#242033; --border:#2F2A40; --border2:#3A3450;
  --ink:#F3F1F8; --muted:#A9A3B8; --purple:#B49BFF; --purple-line:#6E58B8; --tint:#2A2240;
  --green:#52D69F; --green-tint:#17302A; --btn:#7447E8; --btn-ink:#FFFFFF;
  --hero:#231A47; --hero-ink:#FFFFFF; --hero-muted:#C9C0EA; --hero-green:#5BE0A6; --hero-purple:#B79CFF;
  --warn:#E8AE52; --warn-tint:#33280F; --danger:#FF8A80; --danger-tint:#3A1A18;
  --seg-base:#5A546B; --seg-n:#8F6BE8; --seg-nd:#D9CCFF; --seg-d:#5B45A0; --seg-x:#52D69F;
  --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
h1,h2,p{margin:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.shell{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
main{flex:1;overflow-y:auto;padding:20px 16px 96px;display:flex;flex-direction:column;gap:14px}
main>*,.view>*,.colA>*,.colB>*{flex-shrink:0}
.col{display:flex;flex-direction:column}.row{display:flex;align-items:center}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap14{gap:14px}.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.h1{font-size:22px;font-weight:700}
.small{font-size:12px}.xs{font-size:12px}
.label{font-size:13px;font-weight:600}
.card{background:var(--surf);border:1px solid var(--border);border-radius:16px}
.pad{padding:14px}

/* nav */
nav.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surf);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--purple);font-weight:600}
.fab{position:absolute;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;box-shadow:var(--shadow)}

/* controls */
.btn{height:50px;border-radius:14px;border:0;background:var(--btn);color:var(--btn-ink);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;width:100%}
.btn.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--border2)}
.btn.danger{background:var(--danger-tint);color:var(--danger)}
.btn:disabled{opacity:.5}
.pill{height:44px;display:flex;align-items:center;gap:2px;background:var(--surf);border:1px solid var(--border);border-radius:999px;padding:4px}
.icon-btn{width:36px;height:36px;border:0;background:none;border-radius:999px;display:flex;align-items:center;justify-content:center}
.seg{display:grid;gap:4px;background:var(--surf2);border-radius:12px;padding:4px}
.seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{height:40px;border:0;border-radius:9px;background:none;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.input{height:48px;width:100%;border:1px solid var(--border2);border-radius:12px;background:var(--surf);padding:0 12px;font-size:16px;font-weight:500;min-width:0}
.input.opt{border-style:dashed}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:12px;min-height:44px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--purple);flex-shrink:0}
.check.green input{accent-color:var(--green)}

/* resumen */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{font-size:13px;color:var(--hero-muted)}
.hero .big{font-family:var(--display);font-size:clamp(38px,12vw,48px);font-weight:700;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.hero .info{width:32px;height:32px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:var(--hero-muted);display:flex;align-items:center;justify-content:center}
.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.12);display:flex;overflow:hidden}
.bar .g{background:var(--hero-green);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar .a{background:repeating-linear-gradient(45deg,var(--hero-purple) 0 4px,transparent 4px 7px);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.duo .card{padding:14px;display:flex;flex-direction:column;gap:8px}
.duo .card.dash{border:1.5px dashed var(--purple-line)}
.dot{width:10px;height:10px;border-radius:999px;flex-shrink:0}
.duo .amt{font-family:var(--display);font-size:clamp(20px,6.2vw,24px);font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.c-green{color:var(--green)}.c-purple{color:var(--purple)}.c-warn{color:var(--warn)}.c-danger{color:var(--danger)}

/* turnos */
.trow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surf);min-height:64px;width:100%;border:0;text-align:left;font-size:14px}
.badge{width:44px;height:44px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.badge b{font-size:16px;line-height:1}.badge span{font-size:10px;font-weight:600}
.b-G{background:var(--green-tint);color:var(--green)}.b-A,.b-C{background:var(--tint);color:var(--purple)}.b-L{background:var(--surf2);color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--surf2);color:var(--muted)}
.swipe{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surf2)}
.swipe .under{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:stretch}
.swipe .under span{width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600}
.swipe .under .ed{background:var(--btn);color:var(--btn-ink)}.swipe .under .del{background:var(--danger);color:#fff}
.swipe .trow{position:relative;width:100%;border:0;text-align:left;touch-action:pan-y;transition:transform .2s}
.swipe .trow.drag{transition:none}
.earned{animation:earn 1.6s ease-out}
@keyframes earn{0%{background:var(--tint)}60%{background:var(--green-tint)}100%{background:var(--surf)}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal button{height:48px;border-radius:10px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font-size:14px;font-weight:600}
.cal button i{width:6px;height:6px;border-radius:999px;display:block}
.cal .s-G{background:var(--green-tint)}.cal .s-G i{background:var(--green)}
.cal .s-A,.cal .s-C{background:var(--tint)}.cal .s-A i,.cal .s-C i{background:var(--purple)}
.cal .s-L{background:var(--surf2)}.cal .s-L i{background:var(--muted)}
.cal .fer{box-shadow:inset 0 0 0 1.5px var(--purple-line)}
.cal .hoy{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .sel{outline:2px solid var(--purple);outline-offset:1px}
.cal .out{color:var(--border2)}

/* liquidación */
.liq-h{display:flex;justify-content:space-between;padding:12px 14px 4px;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--muted);text-transform:uppercase}
.liq-r{display:flex;justify-content:space-between;gap:12px;padding:7px 14px;font-size:13px}
.liq-r .v{font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.sep{border-top:1px solid var(--surf2);margin-top:6px}
.liq-tot{display:grid;grid-template-columns:1fr auto;gap:6px;padding:12px 14px;background:var(--bg);font-size:12px;margin-top:10px}
.liq-fin{display:flex;justify-content:space-between;align-items:baseline;padding:16px 14px;background:var(--hero);color:var(--hero-ink)}
.note{background:var(--tint);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.45}
.note svg{flex-shrink:0;margin-top:1px}
.note.warn{background:var(--warn-tint);color:var(--warn)}.note.err{background:var(--danger-tint);color:var(--danger)}

/* ajustes */
.set-t{font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--muted);padding:0 4px;text-transform:uppercase}
.set-r{min-height:48px;padding:6px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--surf2)}
.set-r:first-child{border-top:0}
.set-r input[type=number],.set-r input[type=time],.set-r select{width:132px;flex-shrink:0;height:36px;border:1px solid var(--border2);border-radius:10px;background:var(--bg);padding:0 8px;font-size:15px;font-weight:600;text-align:right;font-family:var(--display)}
.set-r select{width:150px;text-align:left;font-family:var(--body)}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(10,8,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.tf{display:flex;align-items:center;gap:6px}
.tf .input{padding:0 6px;text-align:center;text-align-last:center}
.tl{display:flex;height:26px;border-radius:8px;overflow:hidden}
.tl span{display:block;min-width:1px}
.k-base{background:var(--seg-base)}.k-n{background:var(--seg-n)}.k-nd{background:var(--seg-nd)}.k-d{background:var(--seg-d)}.k-x{background:var(--seg-x)}
.k-xn{background:repeating-linear-gradient(45deg,var(--seg-x) 0 5px,var(--seg-n) 5px 10px)}.k-xd{background:repeating-linear-gradient(45deg,var(--seg-x) 0 5px,var(--seg-d) 5px 10px)}.k-xnd{background:repeating-linear-gradient(45deg,var(--seg-x) 0 5px,var(--seg-nd) 5px 10px)}
.tl .k-brk{background:repeating-linear-gradient(45deg,var(--border2) 0 3px,var(--surf) 3px 6px)}
.lg{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:13px}
.lg i{width:10px;height:10px;border-radius:3px;display:block;flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--hero);color:var(--hero-ink);border:1px solid var(--purple-line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:500;z-index:30;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--hero-green);font-weight:700;font-size:14px;min-height:32px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.1s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}

/* bienvenida */
.welcome{min-height:100%;background:var(--hero);color:var(--hero-ink);padding:48px 24px 28px;display:flex;flex-direction:column;gap:22px}
.welcome h1{font-family:var(--display);font-size:36px;line-height:1.08;letter-spacing:-1px;text-wrap:balance}
.welcome .ic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.welcome .box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.45;color:var(--hero-muted)}
.welcome .cta{height:54px;border-radius:16px;border:0;background:var(--hero-green);color:#24174F;font-size:16px;font-weight:700}
.welcome .alt{height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:none;color:#fff;font-size:14px;font-weight:600}
.afp{min-height:44px;padding:0 14px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--surf2)}
.afp:first-child{border-top:0}
.afp input{width:20px;height:20px;margin:0;accent-color:var(--purple)}
.beta{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;padding:2px 8px;border-radius:999px;background:var(--warn-tint);color:var(--warn);vertical-align:middle;line-height:1.5}
.cmp-head{display:grid;grid-template-columns:minmax(0,1fr) 116px minmax(0,1fr);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding-bottom:6px}
.cmp{position:relative;display:flex;flex-direction:column}
.cmp::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--border2)}
.cmp-r{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 116px minmax(0,1fr);align-items:center;padding:8px 0;border-top:1px solid var(--surf2)}
.cmp-r .lb{grid-column:1/-1;justify-self:center;text-align:center;font-size:12px;color:var(--muted);margin-bottom:4px;position:relative;z-index:1;background:var(--surf);padding:0 8px;border-radius:6px}
.cmp-r .e{text-align:right;padding-right:10px;font-size:14px;font-weight:600;white-space:nowrap}
.cmp-r .r{text-align:left;padding-left:10px;font-size:14px;font-weight:600;white-space:nowrap}
.cmp-r.tot .lb{font-weight:700;color:var(--ink)}.cmp-r.tot .e,.cmp-r.tot .r{font-size:16px;font-weight:700}
.d{justify-self:center;text-align:center;border-radius:10px;padding:4px 8px;font-family:var(--display);font-size:13px;font-weight:700;position:relative;z-index:1;min-width:84px;font-variant-numeric:tabular-nums;line-height:1.25}
.d small{display:block;font-family:var(--body);font-size:11px;font-weight:600;opacity:.9}
.d.up{color:var(--green);background:var(--green-tint)}.d.down{color:var(--danger);background:var(--danger-tint)}.d.eq{color:var(--muted);background:var(--surf2)}
label.btn{cursor:pointer}
.view,.colA,.colB{display:contents}
@media (min-width: 900px){
  .shell[data-mode="app"]{max-width:1240px;flex-direction:row}
  .shell[data-mode="app"] nav.tabs{order:-1;width:224px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;padding:28px 14px;border-top:0;border-right:1px solid var(--border)}
  .shell[data-mode="app"] nav.tabs::before{content:'Sueldito';font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.4px;padding:0 12px 20px;color:var(--purple)}
  .shell[data-mode="app"] nav.tabs button{height:48px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 12px;border-radius:12px;font-size:14px}
  .shell[data-mode="app"] nav.tabs button[aria-current="page"]{background:var(--tint)}
  .shell[data-mode="app"] main{padding:32px 36px 56px}
  .view{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:20px 28px;align-items:start}
  .view>.full{grid-column:1/-1}
  .colA,.colB{display:flex;flex-direction:column;gap:14px;min-width:0}
  .view.v-aj{display:block;column-count:2;column-gap:28px}
  .v-aj>section{break-inside:avoid;margin-bottom:18px}
  .v-aj>h1{column-span:all;margin-bottom:18px}
  .fab{bottom:28px;right:36px}
  .scrim{align-items:center}
  .sheet{border-radius:22px;max-width:520px;max-height:90%;padding-bottom:20px}
  .toast{bottom:28px}
  .h1{font-size:26px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>

</head>
<body>
<div id="app" class="shell"></div>
<div id="sheet"></div>

function bounds(sh){ const a=dt(sh.f,sh.e); let b=dt(sh.f,sh.s); if(b<=a) b=dt(sh.f,sh.s,1); return [a,b]; }

function breakRange(sh){

  shifts.forEach(sh=>{ if(sh.lic) return;

function payroll(T, haberes, pres){
  const c=D.cfg, V=c.valorHora, r=Math.round;
  const P={T, hBase:hrs(T.base), hExtra:hrs(T.extra), hNoct:hrs(T.noct), hDom:hrs(T.dom), hNoctDom:hrs(T.noctDom), hTot:hrs(T.tot)};
  P.base=r(P.hBase*V); P.extra=r(P.hExtra*V*(1+c.rExtra/100)); P.noct=r(P.hNoct*V*c.rNoct/100);
  P.dom=r(P.hDom*V*c.rDom/100); P.noctDom=r(P.hNoctDom*V*c.rNoctDom/100);
  P.habImp=haberes.filter(h=>h.imp); P.habNo=haberes.filter(h=>!h.imp);

  <circle cx="20" cy="20" r="16" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="${lg>0?'round':'butt'}" stroke-dasharray="${lg} ${C}" transform="rotate(-90 20 20)"/></svg>`;

function weekStats(list, now, fer){
  let g=0,a=0,x=0;
  list.forEach(sh=>{ if(sh.lic) return; minuteKinds(sh,fer).forEach(k=>{ if(k.brk) return; if(k.extra){x++;return;} if(k.t<now.getTime()) g++; else a++; }); });
  return {g:hrs(g),a:hrs(a),x:hrs(x)};
}
function vTurnos(){
  const now=NOW(), list=shiftsOf(UI.ym), fer=feriadoMap();
  const tot=list.filter(s=>!s.lic).reduce((s,sh)=>s+shiftInfo(sh,fer).net,0);
  const wide=WIDE(); let body='', bodyCal='';
  if(wide || UI.vista==='lista'){
    const weeks=new Map();
    list.forEach(sh=>{ const k=ymd(weekStart(bounds(sh)[0])); if(!weeks.has(k)) weeks.set(k,[]); weeks.get(k).push(sh); });
    if(!list.length) body=`<div class="card pad col gap10"><span>No hay turnos en ${MESES[Number(UI.ym.slice(5))-1].toLowerCase()}.</span><button class="btn" data-a="nuevo">${I.plus} Agregar turno</button></div>`;
    weeks.forEach((ws,k)=>{
      const ini=dt(k), fin=dt(k,'00:00',6), st=weekStats(ws,now,fer), hs=D.cfg.horasSem, sum=Math.round((st.g+st.a)*100)/100;
      const det=[st.g?fh(st.g)+' ganadas':'', st.a?fh(st.a)+' agendadas':'', st.x?fh(st.x)+' extra':'', ws.some(s=>s.lic)?'licencia':''].filter(Boolean).join(' · ');
      body+=`<section class="col gap8"><div class="row gap10" style="padding:0 2px">${ring(st.g,st.a,hs)}
        <div class="col grow"><span class="label" style="font-weight:700">Semana ${ini.getDate()}${ini.getMonth()!==fin.getMonth()?' '+MES3[ini.getMonth()]:''} – ${fin.getDate()} ${MES3[fin.getMonth()]}</span><span class="small muted">${det||'Sin horas'}</span>
        ${sum>hs?`<span class="small c-warn" style="font-weight:600">Supera tus ${hs} h. ¿Alguna fue extra?</span>`:''}</div>
        <span class="num" style="font-size:15px;font-weight:700;white-space:nowrap">${String(sum).replace('.',',')} / ${hs} h</span></div>
        ${ws.map(sh=>`<div class="swipe" data-id="${sh.id}"><div class="under"><span class="ed">${I.edit}Editar</span><span class="del">${I.trash}Borrar</span></div>${rowShift(sh)}</div>`).join('')}</section>`;
    });
    if(list.length) body+=`<span class="small muted" style="text-align:center">${wide?'Haz clic en un turno para editarlo o borrarlo.':'Desliza a la derecha para editar y a la izquierda para borrar.'}</span>`;
  }
  if(wide || UI.vista!=='lista'){
    const [y,m]=UI.ym.split('-').map(Number), first=new Date(y,m-1,1), off=(first.getDay()+6)%7, days=new Date(y,m,0).getDate(), cells=[];
    const byDay={}; list.forEach(sh=>{ byDay[sh.f]=sh; });
    for(let i=0;i<Math.ceil((off+days)/7)*7;i++){
      const d=new Date(y,m-1,1-off+i), f=ymd(d), inM=d.getMonth()===m-1, sh=byDay[f];
      const cls=[inM?'':'out', sh&&inM?'s-'+statusOf(sh,now):'', inM&&fer.has(f)?'fer':'', f===ymd(now)?'hoy':'', f===UI.selDay?'sel':''].join(' ');
      const st=sh?{G:'ganado',A:'agendado',C:'en curso',L:'licencia'}[statusOf(sh,now)]:'libre';
      cells.push(`<button class="${cls}" ${inM?`data-a="dia" data-f="${f}"`:'disabled'} aria-label="${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()}, ${st}${fer.has(f)?', feriado':''}">${d.getDate()}<i></i></button>`);
    }
    const sel=UI.selDay&&UI.selDay.slice(0,7)===UI.ym?UI.selDay:null, sd=sel?dt(sel):null, ssh=sel?byDay[sel]:null, fh_=sel?fer.get(sel):null;

      <div class="cal xs muted" style="text-align:center;font-weight:600"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="cal">${cells.join('')}</div>
      <div class="row gap12 xs muted" style="justify-content:center;flex-wrap:wrap;padding-top:4px">
        <span class="row gap4"><span class="dot" style="width:8px;height:8px;background:var(--green)"></span>Ganado</span>
        <span class="row gap4"><span class="dot" style="width:8px;height:8px;background:var(--purple)"></span>Agendado</span>
        <span class="row gap4"><span class="dot" style="width:8px;height:8px;background:var(--muted)"></span>Licencia</span>
        <span class="row gap4"><span style="width:9px;height:9px;border-radius:2px;border:1.5px solid var(--purple-line)"></span>Feriado</span></div></div>
    ${sel?`<div class="col gap8"><span class="label muted">${DIAL[sd.getDay()][0].toUpperCase()+DIAL[sd.getDay()].slice(1)} ${sd.getDate()}${sel===ymd(now)?' · hoy':''}${fh_?' · '+esc(fh_.n):''}</span>
      ${ssh?`<div class="card" style="overflow:hidden">${rowShift(ssh,{monto:true})}</div>`:`<button class="btn ghost" data-a="nuevo" data-f="${sel}">${I.plus} Agregar turno este día</button>`}</div>`

  <div class="row between small muted full"><span>${list.filter(s=>!s.lic).length} turnos · ${fh(hrs(tot))}</span></div>
  ${wide?'':`<div class="seg c2"><button data-a="vista" data-v="lista" aria-pressed="${UI.vista==='lista'}">${I.list}Lista</button><button data-a="vista" data-v="cal" aria-pressed="${UI.vista==='cal'}">Calendario</button></div>`}
  <div class="colA">${wide||UI.vista==='lista'?body:bodyCal}</div>${wide?`<div class="colB">${bodyCal}</div>`:''}</div>`;
}

const WIDE = () => !!(window.matchMedia && matchMedia('(min-width: 900px)').matches);
const HORAS = Array.from({length:24},(_,i)=>pad(i));
function tf(k,opt){
  const v=UI.sheet.d[k]||'', h=v?v.slice(0,2):'', m=v?v.slice(3,5):'00';
  const custom=(UI.sheet.cm&&UI.sheet.cm[k]) || (v && m!=='00' && m!=='30');
  return `<div class="tf"><select class="input num" id="sf-${k}-h" data-th="${k}" aria-label="Hora">${(opt||!v)?`<option value="" ${h===''?'selected':''}>--</option>`:''}${HORAS.map(x=>`<option ${x===h?'selected':''}>${x}</option>`).join('')}</select>
    <span class="num" style="font-weight:700">:</span>
    ${custom?`<input class="input num" type="number" inputmode="numeric" min="0" max="59" id="sf-${k}-m" data-tm="${k}" value="${m}" aria-label="Minutos">`
      :`<select class="input num" id="sf-${k}-m" data-tm="${k}" aria-label="Minutos"><option ${m==='00'?'selected':''}>00</option><option ${m==='30'?'selected':''}>30</option><option value="otro">Otro…</option></select>`}</div>`;
}
function onTime(el){
  const k=el.dataset.th||el.dataset.tm, d=UI.sheet.d; UI.sheet.cm=UI.sheet.cm||{};
  const hs=document.getElementById('sf-'+k+'-h'), ms=document.getElementById('sf-'+k+'-m'); if(!hs||!ms) return;
  const h=hs.value;
  if(ms.tagName==='SELECT' && ms.value==='otro'){ UI.sheet.cm[k]=true; d[k]=h===''?'':h+':00'; renderSheet();
    const n=document.getElementById('sf-'+k+'-m'); if(n){ n.focus(); if(n.select) n.select(); } return; }
  if(h===''){ d[k]=''; } else { let m=parseInt(ms.value,10); if(!(m>=0)) m=0; if(m>59) m=59; d[k]=h+':'+pad(m); }
  previewShift();
}

function previewShift(){

  if(!v.err.length && d.lic) h+=`<div class="note">${I.info}<span>Queda registrado como licencia. No suma horas ni dinero; el subsidio de la licencia lo paga tu sistema de salud aparte.</span></div>`;
  if(!v.err.length && !d.lic){
    const fer=feriadoMap(), ks=minuteKinds(d,fer), segs=[]; const rc=k=>k.dom&&k.night?'nd':(k.dom?'d':(k.night?'n':'')); const cat=k=>k.brk?'brk':(k.extra?'x'+(D.cfg.extraSuma?rc(k):''):(rc(k)||'base'));

      .filter(x=>cnt[x[0]]).map(([k,l,p])=>`<div class="lg"><span class="row gap8"><i class="k-${k}"></i>${l} <span class="muted">${p}</span></span><span class="num">${fh(hrs(cnt[k]))}</span></div>`).join('');
    const ym=d.f.slice(0,7), con=monthData(ym,null,{sin:d.id,mas:d}).total.liq, sin=monthData(ym,null,{sin:d.id}).total.liq;
    h+=`<div class="card pad col gap10"><div class="row between"><span class="label">Así se pagará</span><span class="small muted">${fh(hrs(ks.filter(k=>!k.brk).length))} netas</span></div>
      <div class="tl" aria-hidden="true">${segs.map(s=>`<span class="k-${s.c}" style="width:${s.n/ks.length*100}%"></span>`).join('')}</div>
      <div class="row between xs muted num"><span>${hm(a)}</span><span>${br?'break '+hm(br.s)+(br.est?' (estimado)':''):'sin break'}</span><span>${hm(b)}</span></div>
      <div class="col gap6">${lg}</div>
      <div class="row between" style="border-top:1px solid var(--surf2);padding-top:8px"><span class="col" style="gap:2px"><span class="small muted">Suma a tu líquido</span><span class="xs muted">Aprox. · cada minuto cuenta</span></span>
      <span class="num c-green" style="font-size:17px;font-weight:600">+${money(con-sin)}</span></div></div>`;
  }
  box.innerHTML=h;
}

/* ================= Render ================= */
function applyTheme(){ const r=document.documentElement; if(D.cfg.tema==='auto'){ if(r.dataset.themeBy==='app'){ delete r.dataset.theme; delete r.dataset.themeBy; } } else { r.dataset.theme=D.cfg.tema; r.dataset.themeBy='app'; } }
function render(){
  const app=document.getElementById('app'), sc=app.querySelector('main') ? app.querySelector('main').scrollTop : 0;
  app.dataset.mode = UI.step ? 'single' : 'app';
  if(UI.step==='loading'){ app.innerHTML=vLoading(); }
  else if(UI.step==='auth'){ app.innerHTML=vAuth(); }
  else if(UI.step==='newpass'){ app.innerHTML=vNewPass(); }
  else if(UI.step==='error'){ app.innerHTML=vError(); }
  else if(UI.step==='welcome'){ app.innerHTML=vWelcome(); }
  else if(UI.step==='config'){ app.innerHTML=vConfig(); }
  else {
    const body=(UI.tab==='liq' && UI.cmp) ? (UI.cmp.step==='review'?vReview():vCmp()) : {resumen:vResumen,turnos:vTurnos,liq:vLiq,ajustes:vAjustes}[UI.tab]();
    const tabs=[['resumen','Resumen',I.pulse],['turnos','Turnos',I.cal],['liq','Liquidación',I.doc],['ajustes','Ajustes',I.gear]];
    app.innerHTML=`<main id="main">${body}</main>${UI.tab==='turnos'?`<button class="fab" data-a="nuevo">${I.plus}Agregar turno</button>`:''}
      <nav class="tabs" aria-label="Secciones">${tabs.map(([k,l,ic])=>`<button data-a="tab" data-t="${k}" ${UI.tab===k?'aria-current="page"':''}>${ic}${l}</button>`).join('')}</nav>`;
    const m=app.querySelector('main'); if(m && !UI.resetScroll) m.scrollTop=sc; UI.resetScroll=false;
    bindSwipes(); runAnim();
  }
  renderSheet(); renderToast();
}
function renderSheet(){
  const el=document.getElementById('sheet');
  el.innerHTML = !UI.sheet ? '' : (UI.sheet.type==='shift' ? sheetShift() : sheetAviso());
  if(UI.sheet && UI.sheet.type==='shift') previewShift();
}
function renderToast(){
  const el=document.getElementById('toast');
  el.innerHTML = UI.toast ? `<div class="toast" role="status"><span>${esc(UI.toast.msg)}</span>${UI.toast.undo?'<button data-a="undo">Deshacer</button>':''}</div>` : '';
}
let toastT=null;
function toast(msg, undo){ UI.toast={msg,undo}; renderToast(); clearTimeout(toastT); toastT=setTimeout(()=>{ UI.toast=null; renderToast(); }, undo?6000:3200); }
function runAnim(){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const els=[...document.querySelectorAll('[data-count]')], bars=[...document.querySelectorAll('.bar [data-w]')];
  if(!UI.animate || reduce){ bars.forEach(b=>b.style.width=b.dataset.w+'%'); UI.animate=false; UI.fromG=null; return; }
  UI.animate=false; UI.fromG=null;
  requestAnimationFrame(()=>bars.forEach(b=>b.style.width=b.dataset.w+'%'));
  const t0=performance.now(), dur=700;
  els.forEach(e=>e.setAttribute('aria-label',e.textContent));
  (function step(t){ const x=Math.min(1,(t-t0)/dur), p=1-Math.pow(1-x,3);
    els.forEach(e=>{ if(!e.isConnected) return; const to=Number(e.dataset.count), from=Number(e.dataset.from||0); e.textContent=money(from+(to-from)*p); });
    if(x<1) requestAnimationFrame(step); })(t0);
}
function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('div'); c.className='confetti'; const cols=['#5BE0A6','#B79CFF','#6A3DD1','#0B7F57'];
  for(let i=0;i<44;i++){ const p=document.createElement('i'); p.style.left=Math.random()*100+'%'; p.style.background=cols[i%4]; p.style.animationDelay=(Math.random()*.35)+'s'; p.style.transform='rotate('+Math.random()*90+'deg)'; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(()=>c.remove(),1700);
}

/* ================= Gestos ================= */
function bindSwipes(){
  document.querySelectorAll('.swipe').forEach(w=>{
    const row=w.querySelector('.trow'); let x0=null,y0=0,dx=0,lock=null;
    row.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; lock=null; },{passive:true});
    row.addEventListener('touchmove',e=>{ if(x0===null) return; const ax=e.touches[0].clientX-x0, ay=e.touches[0].clientY-y0;
      if(lock===null && (Math.abs(ax)>8||Math.abs(ay)>8)) lock=Math.abs(ax)>Math.abs(ay)?'x':'y';
      if(lock!=='x') return; dx=Math.max(-110,Math.min(110,ax)); row.classList.add('drag'); row.style.transform='translateX('+dx+'px)'; },{passive:true});
    row.addEventListener('touchend',()=>{ row.classList.remove('drag'); row.style.transform=''; const id=w.dataset.id;
      if(lock==='x'){ row.dataset.swiped='1'; setTimeout(()=>delete row.dataset.swiped,350); if(dx>70) openEdit(id); else if(dx<-70) delShift(id); }
      x0=null; });
  });
}

function openEdit(id){ const s=D.shifts.find(x=>x.id===id); if(!s) return; UI.sheet={type:'shift',edit:true,cm:{},d:{...s}}; renderSheet(); }
let lastDeleted=null;
function delShift(id){ const i=D.shifts.findIndex(x=>x.id===id); if(i<0) return; lastDeleted=D.shifts[i]; D.shifts.splice(i,1); qDel(id); D.demoIds=D.demoIds.filter(x=>x!==id); save(); UI.sheet=null; render(); toast('Turno borrado',true); }
function ejemplo(){
  if(!(D.cfg.valorHora>0)) D.cfg.valorHora=3075; if(!(D.cfg.horasSem>0)) D.cfg.horasSem=20;
  D.shifts.filter(s=>D.demoIds.includes(s.id)).forEach(s=>qDel(s.id));
  D.shifts=D.shifts.filter(s=>!D.demoIds.includes(s.id)); D.demoIds=[];
  const now=NOW(), y=now.getFullYear(), m=now.getMonth(), days=new Date(y,m+1,0).getDate(); let w=0;
  for(let d=1;d<=days;d++){ const x=new Date(y,m,d), wd=x.getDay(), f=ymd(x);
    if(wd===1) w++;
    const add=(e,s)=>{ const sh={id:uid(),f,e,s,bi:'',bv:'',sinBreak:false,extra:'no',xd:'',xh:'',lic:false}; const [a,b]=bounds(sh);
      if(D.shifts.some(o=>{ const [oa,ob]=bounds(o); return a<ob && oa<b; })) return;
      D.shifts.push(sh); D.demoIds.push(sh.id); qUp(sh.id); };
    if(w%3===2){ if(wd===3) add('19:00','02:00'); if(wd===4) add('17:30','00:00'); if(wd===6) add('23:00','07:00'); }
    else { if(wd===2) add('23:00','07:00'); if(wd===3) add('19:00','02:00'); if(wd===4) add('17:30','00:00'); }
  }
  if(!D.haberes.some(h=>h.demo)) D.haberes.push({id:uid(),nombre:'Beca (ejemplo)',monto:75000,imp:true,tipo:'mensual',demo:true});
  D.ejemplo=true; save();
}
async function authGo(){
  const a=UI.auth, em=(document.getElementById('au-e')||{}).value||'', pw=(document.getElementById('au-p')||{}).value||'';
  a.email=em.trim(); a.msg=''; a.ok='';
  if(!sb){ a.msg='No hay conexión. Revisa tu internet y recarga la página.'; render(); return; }
  if(!/^\S+@\S+\.\S+$/.test(a.email)){ a.msg='Escribe un correo válido.'; render(); return; }
  if(a.modo!=='recuperar' && pw.length<8){ a.msg=a.modo==='registro'?'La contraseña debe tener al menos 8 caracteres.':'Escribe tu contraseña.'; render(); return; }
  if(a.modo==='registro' && !document.getElementById('au-ok').checked){ a.msg='Marca la casilla para continuar.'; render(); return; }
  a.busy=true; render();
  try{

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsP=null;
function loadPdfjs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsP) return pdfjsP;
  pdfjsP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=PDFJS+'pdf.min.js';
    s.onload=()=>{ if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; res(pdfjsLib); } else { pdfjsP=null; rej(new Error('lector')); } };
    s.onerror=()=>{ pdfjsP=null; rej(new Error('lector')); }; document.head.appendChild(s); });
  return pdfjsP;
}
async function pdfText(file){
  const lib=await loadPdfjs(), buf=await file.arrayBuffer();
  const doc=await lib.getDocument({data:buf}).promise, lines=[];
  for(let p=1;p<=Math.min(doc.numPages,3);p++){
    const tc=await (await doc.getPage(p)).getTextContent(), rows=[];
    tc.items.forEach(it=>{ if(!it.str||!it.str.trim()) return; const x=it.transform[4], y=it.transform[5];
      let r=rows.find(r=>Math.abs(r.y-y)<3); if(!r){ r={y,it:[]}; rows.push(r); } r.it.push({x,s:it.str,w:it.width||0}); });
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{ r.it.sort((a,b)=>a.x-b.x); let line='', end=null;
      r.it.forEach(i=>{ if(end!==null){ const g=i.x-end; line+= g>20?'   ':(g>1?' ':''); } line+=i.s; end=i.x+i.w; }); lines.push(line.trim()); });
  }
  try{ doc.destroy(); }catch(e){}
  return lines.join('\n');
}
const pesos = s => Number(String(s).replace(/\./g,'').replace(',','.'));
function horasDe(s){
  if(!s) return null; let m=s.match(/(\d+)\s*horas?\s*(\d+)\s*min/i); if(m) return Math.round((+m[1]+ +m[2]/60)*100)/100;
  m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:horas|hrs)\b/i) || s.match(/(\d+[.,]\d{1,2})(?![\d])/); return m?Number(m[1].replace(',','.')):null;
}
const LIQ_RULES=[[/l[ií]quido/i,'liq'],[/total\s+haberes/i,'totHab'],[/total\s+descuentos/i,'totDesc'],[/descuentos\s+legales/i,'skip'],[/otros\s+descuentos/i,'skip'],
  [/haberes\s+no\s+imponibles/i,'noimpTot'],[/haberes\s+imponibles/i,'impTot'],[/imp\.?\s*prev|imp\.?\s*ces|base\s+tributable|^uf\b|tope|valor\s+uf/i,'skip'],
  [/nocturno\s+domingo|domingo\s+nocturno|nocturno\s+festivo/i,'noctDom'],[/nocturno/i,'noct'],[/domingo|festivo/i,'dom'],[/extra|sobretiempo/i,'extra'],
  [/gratificaci/i,'grat'],[/presentismo|movilizaci/i,'mov'],[/sueldo\s+base/i,'base'],
  [/previ|afp/i,'afp'],[/salud|fonasa|isapre/i,'sal'],[/cesant/i,'ces'],[/impuesto/i,'impu'],
  [/anticipo|pr[eé]stamo|cuota|descuento|sindicato|seguro|retenci/i,'otroDesc']];
const R0 = () => ({ ym:'', horas:null, valorHora:null, afpPct:null, base:0, extra:0, hExtra:null, noct:0, hNoct:null, dom:0, hDom:null, noctDom:0, hNoctDom:null,
  grat:0, mov:0, otros:[], afp:0, sal:0, ces:0, impu:0, otrosDesc:[], liq:null, impTot:null, totHab:null, totDesc:null, n:0 });
function parseLiq(text){
  const R=R0(); let m;
  const mesRe=new RegExp('Mes:?\\s*('+MESES.join('|')+')\\s+(\\d{4})','i');
  if((m=text.match(mesRe))) R.ym=m[2]+'-'+pad(MESES.findIndex(x=>x.toLowerCase()===m[1].toLowerCase())+1);
  if((m=text.match(/Horas\s+Trabajadas:?\s*(\d+(?:[.,]\d+)?)/i))) R.horas=Number(m[1].replace(',','.'));
  if((m=text.match(/Sueldo\s+Base:?\s*\$\s*([\d.]+)\s*por\s+hora/i))) R.valorHora=pesos(m[1]);
  if((m=text.match(/Previsi[oó]n:?\s*[^\n(]*\(\s*(\d+(?:[.,]\d+)?)\s*%?\s*\)/i))) R.afpPct=Number(m[1].replace(',','.'));
  let sec='imp';
  text.split('\n').forEach(raw=>{
    const line=raw.replace(/Sueldo\s+Base:?\s*\$\s*[\d.]+\s*por\s+hora/i,'');
    const re=/([^$]*?)\$\s*([\d.]+(?:,\d+)?)/g; let p;
    while((p=re.exec(line))){
      const label=p[1].trim().split(/\s{3,}/).pop().replace(/[:\s]+$/,'').replace(/^\s+/,''), v=pesos(p[2]); if(!label) continue;
      if(/haberes\s+no\s+imponibles/i.test(label)) sec='noimp';
      const rule=LIQ_RULES.find(r=>r[0].test(label)), k=rule?rule[1]:'otro';
      if(k==='skip') continue;
      R.n++;
      if(k==='otro'){ R.otros.push({n:label,v,imp:sec!=='noimp'}); continue; }
      if(k==='otroDesc'){ R.otrosDesc.push({n:label,v}); continue; }
      if(['liq','totHab','totDesc','noimpTot','impTot'].includes(k)){ R[k]=v; continue; }
      R[k]+=v;
      const hk={noct:'hNoct',dom:'hDom',noctDom:'hNoctDom',extra:'hExtra'}[k]; if(hk){ const h=horasDe(label); if(h!=null) R[hk]=(R[hk]||0)+h; }
    }
  });
  return R;
}
function realTotals(R){
  const oi=R.otros.filter(o=>o.imp).reduce((s,o)=>s+o.v,0), on=R.otros.filter(o=>!o.imp).reduce((s,o)=>s+o.v,0);
  const imp=R.base+R.extra+R.noct+R.dom+R.noctDom+R.grat+oi, totHab=imp+R.mov+on;
  const desc=R.afp+R.sal+R.ces+R.impu+R.otrosDesc.reduce((s,o)=>s+o.v,0);
  return {oi,on,imp,totHab,desc,liq:totHab-desc};
}

        <button class="set-r c-purple" style="width:100%;border-left:0;border-right:0;border-bottom:0;background:none;font-weight:600" data-a="rvAdd" data-k="otrosDesc"><span>Agregar otro descuento</span>${I.plus}</button></div></section>
      <section class="col gap6"><span class="set-t">Resultado</span><div class="card">${f('liq','Líquido a recibir')}
        <div class="set-r"><span class="muted">Suma de lo que ingresaste</span><b class="num" id="rv-calc">${money(T.liq)}</b></div></div></section>
      <div id="rv-warn">${difLiq?`<div class="note warn">${I.info}<span>La suma de los montos (${money(T.liq)}) no coincide con el líquido (${money(R.liq)}). Revisa si falta o sobra algún ítem.</span></div>`:''}</div>
      <button class="btn" style="height:52px" data-a="rvSave">Guardar y comparar</button>
      <button class="btn ghost" data-a="cmpBack">Cancelar</button>
    </div></div>`;
}
function cmpRows(ym){
  const P=monthData(ym).total, c=D.cfg, V=c.valorHora, R=D.reales[ym], T=realTotals(R), r=x=>x||0;
  const estOtros=P.habImp.concat(P.habNo).reduce((s,h)=>s+h.monto,0);
  const rows=[
    ['Horas trabajadas',P.hTot,R.horas,'h'],
    ['Sueldo base',P.base,R.base,'hab',V],
    (P.extra||R.extra)?['Horas extra',P.extra,R.extra,'hab',V*(1+c.rExtra/100)]:null,
    ['Adicional nocturno',P.noct,R.noct,'hab',V*c.rNoct/100],
    ['Domingo / festivo',P.dom,R.dom,'hab',V*c.rDom/100],
    ['Nocturno domingo',P.noctDom,R.noctDom,'hab',V*c.rNoctDom/100],
    (estOtros||T.oi||T.on)?['Otros haberes',estOtros,T.oi+T.on,'hab',null]:null,
    ['Gratificación',P.grat,R.grat,'hab',null],
    ['Presentismo / movilización',P.mov,R.mov,'hab',null],
    ['Total haberes',P.totHab,T.totHab,'tot',V],
    ['AFP',P.afp,R.afp,'desc'],['Salud',P.sal,R.sal,'desc'],['Seguro de cesantía',P.ces,R.ces,'desc'],
    (R.impu||R.otrosDesc.length)?['Impuesto y otros descuentos',0,R.impu+R.otrosDesc.reduce((s,o)=>s+o.v,0),'desc']:null,
    ['Total descuentos',P.desc,T.desc,'desc']
  ].filter(Boolean);
  return {P,R,T,rows,liqReal:R.liq!=null?R.liq:T.liq};
}
function diffChip(est,real,kind,rate){
  if(real==null||est==null) return `<span class="d eq">—</span>`;
  const d=real-est;
  if(kind==='h'){ if(Math.abs(d)<0.02) return `<span class="d eq">=</span>`; return `<span class="d ${d>0?'up':'down'}">${d>0?'+':'−'}${hmTxt(d)}</span>`; }
  if(Math.abs(d)<1) return `<span class="d eq">=</span>`;
  const good = kind==='desc' ? d<0 : d>0;
  const eq = rate && kind!=='desc' && Math.abs(d)/rate*60>=1 ? `<small>≈ ${hmTxt(Math.abs(d)/rate)}</small>` : '';
  return `<span class="d ${good?'up':'down'}">${d>0?'+':'−'}${money(Math.abs(d))}${eq}</span>`;
}
function diag(ym){
  const {P,R,T}=cmpRows(ym), c=D.cfg, out=[], pct=(a,b)=>b>0?a/b*100:null, r2=x=>Math.round(x*100)/100, f2=x=>String(r2(x)).replace('.',',');
  const impR=R.impTot||T.imp;
  const vh=R.valorHora || (R.base&&R.horas?R.base/R.horas:null);
  if(vh && Math.abs(vh-c.valorHora)>=1) out.push(['error',`Tu valor hora está configurado en ${money(c.valorHora)}, pero tu liquidación indica ${money(vh)}.`,'valorHora',Math.round(vh)]);
  let p=R.afpPct || pct(R.afp,impR);
  if(p && Math.abs(p-c.afpPct)>0.05) out.push(['error',`Tu AFP descuenta ${f2(p)}% y en tu configuración tienes ${f2(c.afpPct)}%.`,'afpPct',r2(p)]);
  p=pct(R.sal,impR); if(p && Math.abs(p-c.saludPct)>0.05) out.push(['error',`Tu salud descuenta ${f2(p)}% y en tu configuración tienes ${f2(c.saludPct)}%.`,'saludPct',r2(p)]);
  if(impR>0 && !R.ces && c.contrato==='indefinido') out.push(['aviso','Tu liquidación no descuenta seguro de cesantía. Si tu contrato es a plazo fijo, cámbialo en tu configuración.','contrato','plazo']);
  else if(R.ces && c.contrato!=='indefinido') out.push(['aviso','Tu liquidación descuenta seguro de cesantía, lo que corresponde a un contrato indefinido.','contrato','indefinido']);
  else if(R.ces){ p=pct(R.ces,impR); if(p && Math.abs(p-c.cesPct)>0.05) out.push(['aviso',`El seguro de cesantía es ${f2(p)}% y tienes ${f2(c.cesPct)}%.`,'cesPct',r2(p)]); }
  const tope=Math.round(4.75*c.imm/12);
  if(R.grat>0){ if(!c.gratOn) out.push(['error','Tu liquidación incluye gratificación, pero la tienes desactivada.','gratOn',true]);
    else if(R.grat<tope-2){ p=pct(R.grat,impR-R.grat); if(p && Math.abs(p-c.gratPct)>0.5) out.push(['aviso',`Tu gratificación equivale a ${f2(p)}% y tienes ${f2(c.gratPct)}%.`,'gratPct',Math.round(p*10)/10]); } }
  else if(impR>0 && c.gratOn) out.push(['aviso','Tu liquidación no incluye gratificación, pero la tienes activada.','gratOn',false]);
  if(R.mov>0 && R.base>0){ p=pct(R.mov,R.base); if(Math.abs(p-c.presPct)>1) out.push(['aviso',`Tu presentismo equivale a ${f2(p)}% de tu sueldo base y tienes ${f2(c.presPct)}%.`,'presPct',Math.round(p*10)/10]);
    if(!presOf(ym)) out.push(['info','Te pagaron presentismo, pero este mes tienes la casilla desmarcada.','pres',true]); }
  else if(!R.mov && presOf(ym)) out.push(['info','Este mes no te pagaron presentismo y tienes la casilla marcada.','pres',false]);
  const V=vh||c.valorHora;
  [['noct','hNoct','rNoct','nocturno'],['dom','hDom','rDom','de domingo o festivo'],['noctDom','hNoctDom','rNoctDom','nocturno de domingo']].forEach(([a,h,k,n])=>{
    if(R[a]>0 && R[h]>0){ const q=R[a]/(R[h]*V)*100; if(Math.abs(q-c[k])>1) out.push(['aviso',`Tu recargo ${n} equivale a ${f2(q)}% y tienes ${c[k]}%.`,k,Math.round(q)]); } });
  if(R.horas!=null && Math.abs(R.horas-P.hTot)>=0.5) out.push(['info',`Registraste ${fh(P.hTot)} y la liquidación indica ${fh(R.horas)} (${R.horas>P.hTot?'+':'−'}${hmTxt(R.horas-P.hTot)}). Puede faltar algún turno, o tus marcas y breaks reales fueron distintos.`]);
  if(R.hNoct!=null && Math.abs(R.hNoct-P.hNoct)>=0.5) out.push(['info',`Horas nocturnas: Sueldito calculó ${fh(P.hNoct)} y la liquidación indica ${fh(R.hNoct)}.`]);
  R.otros.forEach(o=>{ const ws=o.n.toLowerCase().split(/[^a-záéíóúñ]+/).filter(w=>w.length>=4); if(!D.haberes.some(h=>{ const hn=h.nombre.toLowerCase(); return ws.some(w=>hn.includes(w)); })) out.push(['info',`Tu liquidación incluye “${o.n}” (${money(o.v)}). Si se repite cada mes, agrégalo en Ajustes → Otros haberes.`]); });
  return out;
}
function vCmp(){
  const ym=UI.cmp.ym, {P,R,T,rows,liqReal}=cmpRows(ym), d=liqReal-P.liq, V=D.cfg.valorHora, ds=diag(ym);
  const icon={error:'c-danger',aviso:'c-warn',info:'c-purple'};
  const fixTxt=(k,v)=>({valorHora:'Usar '+money(v),afpPct:'Usar '+String(v).replace('.',',')+'%',saludPct:'Usar '+String(v).replace('.',',')+'%',cesPct:'Usar '+String(v).replace('.',',')+'%',gratPct:'Usar '+String(v).replace('.',',')+'%',presPct:'Usar '+String(v).replace('.',',')+'%',rNoct:'Usar '+v+'%',rDom:'Usar '+v+'%',rNoctDom:'Usar '+v+'%',contrato:v==='plazo'?'Cambiar a plazo fijo':'Cambiar a indefinido',gratOn:v?'Activar':'Desactivar',pres:v?'Marcar':'Desmarcar'})[k];
  return `<div class="view"><div class="row gap8 full"><button class="icon-btn" style="width:44px;height:44px" data-a="cmpBack" aria-label="Volver">${I.prev}</button>
      <div class="col grow"><h1 class="h1">Estimado vs. real</h1><span class="small muted">${ymLabel(ym)} · <span class="beta">BETA</span></span></div></div>
    <div class="colA">
      <section class="hero" style="gap:10px"><span class="lbl">Tu líquido real fue</span>
        <span class="big" style="font-size:clamp(30px,9vw,40px);color:${Math.abs(d)<1?'var(--hero-ink)':(d>0?'var(--hero-green)':'#FF9C94')}">${Math.abs(d)<1?'igual al estimado':(d>0?'+':'−')+money(Math.abs(d))}</span>
        <span class="small" style="color:var(--hero-muted)">${Math.abs(d)<1?'':(d>0?'más':'menos')+' de lo que estimó Sueldito'+(Math.abs(d)/V*60>=1?' · ≈ '+hmTxt(Math.abs(d)/V)+' de trabajo':'')}</span>
        <div class="row between small" style="color:var(--hero-muted)"><span>Estimado ${money(P.liq)}</span><span>Real ${money(liqReal)}</span></div></section>
      <div class="card" style="padding:12px 12px 4px">
        <div class="cmp-head"><span style="text-align:right;padding-right:10px">Estimado</span><span style="text-align:center">Diferencia</span><span style="padding-left:10px">Real</span></div>
        <div class="cmp">${rows.map(([l,e,r,k,rate])=>`<div class="cmp-r ${k==='tot'?'tot':''}"><span class="lb">${l}</span>
          <span class="e num">${k==='h'?fh(e||0):money(e||0)}</span>${diffChip(e,r,k,rate)}<span class="r num">${r==null?'—':(k==='h'?fh(r):money(r))}</span></div>`).join('')}
          <div class="cmp-r tot"><span class="lb">Líquido a recibir</span><span class="e num">${money(P.liq)}</span>${diffChip(P.liq,liqReal,'tot',V)}<span class="r num">${money(liqReal)}</span></div></div>
        <p class="xs muted" style="padding:10px 2px">Verde: recibiste más de lo estimado. Rojo: recibiste menos. El tiempo (≈) es una aproximación: la diferencia dividida por lo que vale una hora de ese ítem.</p>
      </div>
    </div><div class="colB">
      <section class="col gap8"><span class="set-t">Revisa tu configuración</span>
        ${ds.length?ds.map(([n,t,k,v])=>`<div class="card pad col gap8"><div class="row gap10" style="align-items:flex-start"><span class="${icon[n]}" style="flex-shrink:0;margin-top:2px">${I.info}</span><span class="small" style="line-height:1.45">${esc(t)}</span></div>
          ${k?`<button class="btn ghost" style="height:40px;font-size:14px" data-a="cmpFix" data-k="${k}" data-v="${v}">${fixTxt(k,v)}</button>`:''}</div>`).join('')
          :`<div class="card pad small">No encontramos diferencias en tu configuración. Las diferencias que veas probablemente vienen de tus marcas reales de entrada, salida o break.</div>`}
        ${ds.some(x=>x[2]&&x[2]!=='pres')?`<span class="xs muted">Los cambios de configuración se aplican a todos los meses.</span>`:''}
      </section>
      <div class="grid2"><button class="btn ghost" data-a="cmpEdit">Editar montos</button>${UI.cmpDelConf?`<button class="btn danger" data-a="cmpDelSi">Sí, borrar</button>`:`<button class="btn danger" data-a="cmpDel">Borrar comparación</button>`}</div>
    </div></div>`;
}
function rvRead(el){
  const R=UI.cmp.d;
  if(el.dataset.rv){ const v=el.value.trim(); R[el.dataset.rv]= v===''?(['horas','valorHora','afpPct','hNoct','hDom','hNoctDom','hExtra','liq'].includes(el.dataset.rv)?null:0):Number(v.replace(',','.')); }
  else if(el.dataset.rvo){ const [k,i,f]=el.dataset.rvo.split(':'); const o=R[k][+i]; if(!o) return; if(f==='n') o.n=el.value; else if(f==='v') o.v=Number(el.value)||0; else o.imp=el.checked; }
  const T=realTotals(R), c=document.getElementById('rv-calc'), w=document.getElementById('rv-warn');
  if(c) c.textContent=money(T.liq);
  if(w) w.innerHTML = R.liq!=null && Math.abs(R.liq-T.liq)>2 ? `<div class="note warn">${I.info}<span>La suma de los montos (${money(T.liq)}) no coincide con el líquido (${money(R.liq)}). Revisa si falta o sobra algún ítem.</span></div>` : '';
}
function cmpAct(a, ds){
  switch(a){
    case 'cmpVer': UI.cmp={ym:UI.ym, step:'view'}; UI.cmpDelConf=false; UI.resetScroll=true; render(); return true;
    case 'cmpManual': UI.cmpErr=''; UI.cmp={ym:UI.ym, step:'review', d:R0(), fuente:'manual'}; UI.resetScroll=true; render(); return true;
    case 'cmpBack': UI.cmp=null; UI.cmpDelConf=false; UI.resetScroll=true; render(); return true;
    case 'cmpEdit': { const R=JSON.parse(JSON.stringify(D.reales[UI.cmp.ym])); UI.cmp={ym:UI.cmp.ym, step:'review', d:R, fuente:R.fuente||'manual'}; render(); return true; }
    case 'cmpDel': UI.cmpDelConf=true; render(); return true;
    case 'cmpDelSi': delete D.reales[UI.cmp.ym]; save(); UI.cmp=null; UI.cmpDelConf=false; render(); toast('Comparación borrada'); return true;
    case 'rvAdd': UI.cmp.d[ds.k].push(ds.k==='otros'?{n:'',v:0,imp:true}:{n:'',v:0}); render(); return true;
    case 'rvDel': UI.cmp.d[ds.k].splice(+ds.i,1); render(); return true;
    case 'rvMes': UI.cmp.ym=UI.cmp.d.ym; UI.ym=UI.cmp.d.ym; render(); return true;
    case 'rvSave': { const R=UI.cmp.d, ym=UI.cmp.ym;
      R.otros=R.otros.filter(o=>o.n.trim()||o.v); R.otrosDesc=R.otrosDesc.filter(o=>o.n.trim()||o.v);
      if(!(R.base>0) && !(R.liq>0)){ toast('Ingresa al menos el sueldo base y el líquido.'); return true; }
      const keep={}; ['horas','valorHora','afpPct','base','extra','hExtra','noct','hNoct','dom','hDom','noctDom','hNoctDom','grat','mov','afp','sal','ces','impu','liq','impTot','totHab','totDesc'].forEach(k=>keep[k]=R[k]);
      keep.otros=R.otros.map(o=>({n:o.n.trim(),v:o.v,imp:!!o.imp})); keep.otrosDesc=R.otrosDesc.map(o=>({n:o.n.trim(),v:o.v}));
      keep.fuente=UI.cmp.fuente; keep.fecha=new Date().toISOString();
      D.reales=D.reales||{}; D.reales[ym]=keep; save(); UI.cmp={ym, step:'view'}; UI.resetScroll=true; render(); return true; }
    case 'cmpFix': { const k=ds.k, raw=ds.v, ym=UI.cmp.ym;
      if(k==='pres') D.pres[ym]=raw==='true';
      else if(k==='contrato') D.cfg.contrato=raw;
      else if(k==='gratOn') D.cfg.gratOn=raw==='true';
      else D.cfg[k]=Number(raw);
      save(); render(); toast('Ajuste aplicado'); return true; }
  }
  return false;
}

/* ================= Arranque ================= */
function afterLoad(){
  const now=NOW(), last=D.lastSeen||0;
  if(D.onboarded && last){
    const fer=feriadoMap();
    const just=D.shifts.filter(s=>{ if(s.lic) return false; const b=bounds(s)[1].getTime(); return b>last && b<=now.getTime(); });
    if(just.length){
      UI.earned=just.map(s=>s.id);
      UI.fromG=monthData(UI.ym,new Date(last)).ganado.liq;
      setTimeout(()=>toast(just.length===1?'1 turno pasó a Ganado':just.length+' turnos pasaron a Ganado'),400);
      const hs=D.cfg.horasSem;
      const completo=just.some(s=>{ const k=ymd(weekStart(bounds(s)[0])); const ws=D.shifts.filter(o=>ymd(weekStart(bounds(o)[0]))===k);
        return weekStats(ws,now,fer).g>=hs && weekStats(ws,new Date(last),fer).g<hs; });
      if(completo) setTimeout(confetti,700);
      setTimeout(()=>{ UI.earned=[]; },2500);
    }
  }
  D.lastSeen=now.getTime(); saveLocal();
}
function boot(){
  applyTheme(); render();
  RECOVERY = /type=recovery/.test(location.hash||'');
  if(window.supabase && supabase.createClient){
    sb=supabase.createClient(SB_URL, SB_KEY);
    sb.auth.onAuthStateChange((ev,session)=>{ setTimeout(()=>{
      if(ev==='PASSWORD_RECOVERY' || (RECOVERY && session)){ RECOVERY=true; UI.auth.msg=''; UI.step='newpass'; render(); return; }
      if(ev==='SIGNED_OUT'){ if(USER){ USER=null; KEY=null; D=blank(); UI.step='auth'; render(); } return; }
      if(session && session.user && UI.step!=='newpass' && (!USER || USER.id!==session.user.id)) startSession(session.user);
      else if(!session && ev==='INITIAL_SESSION'){ UI.step='auth'; render(); }
    },0); });
  } else { UI.step='auth'; UI.auth.msg='No se pudo conectar. Revisa tu internet y recarga la página.'; render(); }
  setInterval(()=>{ if(UI.sheet||UI.step) return; const ae=document.activeElement; if(ae && /INPUT|SELECT/.test(ae.tagName)) return;
    const n=NOW(), l=D.lastSeen; const just=D.shifts.filter(s=>{ if(s.lic) return false; const b=bounds(s)[1].getTime(); return b>l && b<=n.getTime(); });
    if(just.length){ UI.earned=just.map(s=>s.id); UI.fromG=monthData(UI.ym,new Date(l)).ganado.liq; UI.animate=true; toast('Un turno pasó a Ganado'); setTimeout(()=>{UI.earned=[];},2500); }
    D.lastSeen=n.getTime(); saveLocal(); render(); }, 60000);
  if(window.matchMedia){ const mq=matchMedia('(min-width: 900px)'), f=()=>{ if(!UI.sheet) render(); }; if(mq.addEventListener) mq.addEventListener('change',f); else if(mq.addListener) mq.addListener(f); }
  window.addEventListener('online',()=>{ if(USER) flush(); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(hasPend()) flush(); else refreshFromCloud(); } });
}
if(typeof document!=='undefined' && document.getElementById('app')) boot();
</script>
