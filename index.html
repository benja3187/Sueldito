<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#24174F">
<title>Sueldito</title>
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}[hidden]{display:none!important}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una pantalla; contenido con scroll, barra de pestañas abajo, hojas inferiores para editar. */
:root{
  --bg:#F6F5FA; --surf:#FFFFFF; --surf2:#EFECF5; --border:#E3DFEC; --border2:#D8D2E6;
  --ink:#17141F; --muted:#5F5A6B; --purple:#6A3DD1; --purple-line:#A58BE8; --tint:#EFE8FD;
  --green:#0B7F57; --green-tint:#E2F4EC; --btn:#6A3DD1; --btn-ink:#FFFFFF;
  --hero:#24174F; --hero-ink:#FFFFFF; --hero-muted:#C9C0EA; --hero-green:#5BE0A6; --hero-purple:#B79CFF;
  --warn:#8A5200; --warn-tint:#FBF0DC; --danger:#B3261E; --danger-tint:#FBE9E7;
  --seg-base:#B8B2C6; --seg-n:#6A3DD1; --seg-nd:#24174F; --seg-d:#A58BE8; --seg-x:#0B7F57;
  --shadow:0 8px 24px rgba(36,23,79,.18);
  --display:'Space Grotesk','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E0C14; --surf:#1A1724; --surf2:#242033; --border:#2F2A40; --border2:#3A3450;
  --ink:#F3F1F8; --muted:#A9A3B8; --purple:#B49BFF; --purple-line:#6E58B8; --tint:#2A2240;
  --green:#52D69F; --green-tint:#17302A; --btn:#7447E8; --btn-ink:#FFFFFF;
  --hero:#231A47; --hero-ink:#FFFFFF; --hero-muted:#C9C0EA; --hero-green:#5BE0A6; --hero-purple:#B79CFF;
  --warn:#E8AE52; --warn-tint:#33280F; --danger:#FF8A80; --danger-tint:#3A1A18;
  --seg-base:#5A546B; --seg-n:#8F6BE8; --seg-nd:#D9CCFF; --seg-d:#5B45A0; --seg-x:#52D69F;
  --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E0C14; --surf:#1A1724; --surf2:#242033; --border:#2F2A40; --border2:#3A3450;
  --ink:#F3F1F8; --muted:#A9A3B8; --purple:#B49BFF; --purple-line:#6E58B8; --tint:#2A2240;
  --green:#52D69F; --green-tint:#17302A; --btn:#7447E8; --btn-ink:#FFFFFF;
  --hero:#231A47; --hero-ink:#FFFFFF; --hero-muted:#C9C0EA; --hero-green:#5BE0A6; --hero-purple:#B79CFF;
  --warn:#E8AE52; --warn-tint:#33280F; --danger:#FF8A80; --danger-tint:#3A1A18;
  --seg-base:#5A546B; --seg-n:#8F6BE8; --seg-nd:#D9CCFF; --seg-d:#5B45A0; --seg-x:#52D69F;
  --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
h1,h2,p{margin:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.shell{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
main{flex:1;overflow-y:auto;padding:20px 16px 96px;display:flex;flex-direction:column;gap:14px}
main>*{flex-shrink:0}
.col{display:flex;flex-direction:column}.row{display:flex;align-items:center}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap14{gap:14px}.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.h1{font-size:22px;font-weight:700}
.small{font-size:12px}.xs{font-size:12px}
.label{font-size:13px;font-weight:600}
.card{background:var(--surf);border:1px solid var(--border);border-radius:16px}
.pad{padding:14px}

/* nav */
nav.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surf);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--purple);font-weight:600}
.fab{position:absolute;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;box-shadow:var(--shadow)}

/* controls */
.btn{height:50px;border-radius:14px;border:0;background:var(--btn);color:var(--btn-ink);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;width:100%}
.btn.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--border2)}
.btn.danger{background:var(--danger-tint);color:var(--danger)}
.btn:disabled{opacity:.5}
.pill{height:44px;display:flex;align-items:center;gap:2px;background:var(--surf);border:1px solid var(--border);border-radius:999px;padding:4px}
.icon-btn{width:36px;height:36px;border:0;background:none;border-radius:999px;display:flex;align-items:center;justify-content:center}
.seg{display:grid;gap:4px;background:var(--surf2);border-radius:12px;padding:4px}
.seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{height:40px;border:0;border-radius:9px;background:none;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.input{height:48px;width:100%;border:1px solid var(--border2);border-radius:12px;background:var(--surf);padding:0 12px;font-size:16px;font-weight:500;min-width:0}
.input.opt{border-style:dashed}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:12px;min-height:44px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--purple);flex-shrink:0}
.check.green input{accent-color:var(--green)}

/* resumen */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{font-size:13px;color:var(--hero-muted)}
.hero .big{font-family:var(--display);font-size:clamp(38px,12vw,48px);font-weight:700;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.hero .info{width:32px;height:32px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:var(--hero-muted);display:flex;align-items:center;justify-content:center}
.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.12);display:flex;overflow:hidden}
.bar .g{background:var(--hero-green);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar .a{background:repeating-linear-gradient(45deg,var(--hero-purple) 0 4px,transparent 4px 7px);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.duo .card{padding:14px;display:flex;flex-direction:column;gap:8px}
.duo .card.dash{border:1.5px dashed var(--purple-line)}
.dot{width:10px;height:10px;border-radius:999px;flex-shrink:0}
.duo .amt{font-family:var(--display);font-size:clamp(20px,6.2vw,24px);font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.c-green{color:var(--green)}.c-purple{color:var(--purple)}.c-warn{color:var(--warn)}.c-danger{color:var(--danger)}

/* turnos */
.trow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surf);min-height:64px;width:100%;border:0;text-align:left;font-size:14px}
.badge{width:44px;height:44px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.badge b{font-size:16px;line-height:1}.badge span{font-size:10px;font-weight:600}
.b-G{background:var(--green-tint);color:var(--green)}.b-A,.b-C{background:var(--tint);color:var(--purple)}.b-L{background:var(--surf2);color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--surf2);color:var(--muted)}
.swipe{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surf2)}
.swipe .under{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:stretch}
.swipe .under span{width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600}
.swipe .under .ed{background:var(--btn);color:var(--btn-ink)}.swipe .under .del{background:var(--danger);color:#fff}
.swipe .trow{position:relative;width:100%;border:0;text-align:left;touch-action:pan-y;transition:transform .2s}
.swipe .trow.drag{transition:none}
.earned{animation:earn 1.6s ease-out}
@keyframes earn{0%{background:var(--tint)}60%{background:var(--green-tint)}100%{background:var(--surf)}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal button{height:48px;border-radius:10px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font-size:14px;font-weight:600}
.cal button i{width:6px;height:6px;border-radius:999px;display:block}
.cal .s-G{background:var(--green-tint)}.cal .s-G i{background:var(--green)}
.cal .s-A,.cal .s-C{background:var(--tint)}.cal .s-A i,.cal .s-C i{background:var(--purple)}
.cal .s-L{background:var(--surf2)}.cal .s-L i{background:var(--muted)}
.cal .fer{box-shadow:inset 0 0 0 1.5px var(--purple-line)}
.cal .hoy{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .sel{outline:2px solid var(--purple);outline-offset:1px}
.cal .out{color:var(--border2)}

/* liquidación */
.liq-h{display:flex;justify-content:space-between;padding:12px 14px 4px;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--muted);text-transform:uppercase}
.liq-r{display:flex;justify-content:space-between;gap:12px;padding:7px 14px;font-size:13px}
.liq-r .v{font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.sep{border-top:1px solid var(--surf2);margin-top:6px}
.liq-tot{display:grid;grid-template-columns:1fr auto;gap:6px;padding:12px 14px;background:var(--bg);font-size:12px;margin-top:10px}
.liq-fin{display:flex;justify-content:space-between;align-items:baseline;padding:16px 14px;background:var(--hero);color:var(--hero-ink)}
.note{background:var(--tint);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.45}
.note svg{flex-shrink:0;margin-top:1px}
.note.warn{background:var(--warn-tint);color:var(--warn)}.note.err{background:var(--danger-tint);color:var(--danger)}

/* ajustes */
.set-t{font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--muted);padding:0 4px;text-transform:uppercase}
.set-r{min-height:48px;padding:6px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--surf2)}
.set-r:first-child{border-top:0}
.set-r input[type=number],.set-r input[type=time],.set-r select{width:132px;flex-shrink:0;height:36px;border:1px solid var(--border2);border-radius:10px;background:var(--bg);padding:0 8px;font-size:15px;font-weight:600;text-align:right;font-family:var(--display)}
.set-r select{width:150px;text-align:left;font-family:var(--body)}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(10,8,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.tl{display:flex;height:26px;border-radius:8px;overflow:hidden}
.tl span{display:block;min-width:1px}
.tl .k-base{background:var(--seg-base)}.tl .k-n{background:var(--seg-n)}.tl .k-nd{background:var(--seg-nd)}.tl .k-d{background:var(--seg-d)}.tl .k-x{background:var(--seg-x)}
.tl .k-brk{background:repeating-linear-gradient(45deg,var(--border2) 0 3px,var(--surf) 3px 6px)}
.lg{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:13px}
.lg i{width:10px;height:10px;border-radius:3px;display:block;flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--hero);color:var(--hero-ink);border:1px solid var(--purple-line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:500;z-index:30;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--hero-green);font-weight:700;font-size:14px;min-height:32px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.1s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}

/* bienvenida */
.welcome{min-height:100%;background:var(--hero);color:var(--hero-ink);padding:48px 24px 28px;display:flex;flex-direction:column;gap:22px}
.welcome h1{font-family:var(--display);font-size:36px;line-height:1.08;letter-spacing:-1px;text-wrap:balance}
.welcome .ic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.welcome .box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.45;color:var(--hero-muted)}
.welcome .cta{height:54px;border-radius:16px;border:0;background:var(--hero-green);color:#24174F;font-size:16px;font-weight:700}
.welcome .alt{height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:none;color:#fff;font-size:14px;font-weight:600}
.afp{min-height:44px;padding:0 14px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--surf2)}
.afp:first-child{border-top:0}
.afp input{width:20px;height:20px;margin:0;accent-color:var(--purple)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>

</head>
<body>
<div id="app" class="shell"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= Datos base ================= */
const AFPS = [['Uno',0.46],['Modelo',0.58],['PlanVital',1.16],['Habitat',1.27],['Capital',1.44],['Cuprum',1.44],['Provida',1.45]];
const FERIADOS = [
 ['2025-07-16','Virgen del Carmen',0],['2025-08-15','Asunción de la Virgen',0],['2025-09-18','Independencia Nacional',1],['2025-09-19','Glorias del Ejército',1],
 ['2025-10-12','Encuentro de Dos Mundos',0],['2025-10-31','Iglesias Evangélicas',0],['2025-11-01','Todos los Santos',0],['2025-11-16','Elecciones',1],
 ['2025-12-08','Inmaculada Concepción',0],['2025-12-14','Elecciones (2ª vuelta)',1],['2025-12-25','Navidad',1],
 ['2026-01-01','Año Nuevo',1],['2026-04-03','Viernes Santo',0],['2026-04-04','Sábado Santo',0],['2026-05-01','Día del Trabajo',1],['2026-05-21','Glorias Navales',0],
 ['2026-06-21','Pueblos Indígenas',0],['2026-06-29','San Pedro y San Pablo',0],['2026-07-16','Virgen del Carmen',0],['2026-08-15','Asunción de la Virgen',0],
 ['2026-09-18','Independencia Nacional',1],['2026-09-19','Glorias del Ejército',1],['2026-10-12','Encuentro de Dos Mundos',0],['2026-10-31','Iglesias Evangélicas',0],
 ['2026-11-01','Todos los Santos',0],['2026-12-08','Inmaculada Concepción',0],['2026-12-25','Navidad',1],
 ['2027-01-01','Año Nuevo',1],['2027-03-26','Viernes Santo',0],['2027-03-27','Sábado Santo',0],['2027-05-01','Día del Trabajo',1],['2027-05-21','Glorias Navales',0],
 ['2027-06-21','Pueblos Indígenas',0],['2027-06-28','San Pedro y San Pablo',0],['2027-07-16','Virgen del Carmen',0],['2027-08-15','Asunción de la Virgen',0],
 ['2027-09-17','Feriado adicional (por confirmar)',0],['2027-09-18','Independencia Nacional',1],['2027-09-19','Glorias del Ejército',1],['2027-10-11','Encuentro de Dos Mundos',0],
 ['2027-10-31','Iglesias Evangélicas',0],['2027-11-01','Todos los Santos',0],['2027-12-08','Inmaculada Concepción',0],['2027-12-25','Navidad',1]
];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA3 = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

const CFG0 = { valorHora:3075, horasSem:20, contrato:'indefinido', afp:'Uno', afpPct:10.46, salud:'fonasa', saludPct:7, cesPct:0.6,
  rNoct:50, rDom:30, rNoctDom:20, rExtra:50, extraSuma:true, nIni:'22:00', nFin:'06:00', breakMin:30, cierre:'02:00',
  gratOn:true, gratPct:25, imm:553553, presPct:20, tema:'auto' };

/* ================= Almacenamiento ================= */
const KEY = 'sueldito.v1';
let mem = null;
function load(){ try{ const t = localStorage.getItem(KEY); if(t) return JSON.parse(t); }catch(e){} return mem; }
function save(){ mem = D; try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){} }
let D = load() || { v:1, onboarded:false, cfg:{...CFG0}, shifts:[], pres:{}, haberes:[], ferOff:[], ferExtra:[], lastSeen:0, ejemplo:false };
D.cfg = {...CFG0, ...D.cfg};

/* ================= Utilidades ================= */
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ymOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
const hm = d => pad(d.getHours())+':'+pad(d.getMinutes());
function dt(f,t,plus){ const [y,m,d]=f.split('-').map(Number); const [h,mi]=(t||'00:00').split(':').map(Number); return new Date(y,m-1,d+(plus||0),h,mi,0,0); }
const money = n => { n=Math.round(n); return (n<0?'-':'')+'$'+String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); };
const hrs = m => Math.round(m/60*100)/100;
const fh = h => h.toFixed(2).replace('.',',')+' h';
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
let NOW = () => new Date();

function feriadoMap(){
  const m = new Map();
  FERIADOS.forEach(([f,n,i])=>{ if(!D.ferOff.includes(f)) m.set(f,{n,irr:!!i}); });
  D.ferExtra.forEach(x=>m.set(x.f,{n:x.n||'Feriado',irr:false}));
  return m;
}

/* ================= Motor de cálculo ================= */
function bounds(sh){ const a=dt(sh.f,sh.e); let b=dt(sh.f,sh.s); if(b<=a) b=dt(sh.f,sh.s,1); return [a,b]; }
function place(sh,t,a){ let x=dt(sh.f,t); if(x<a) x=dt(sh.f,t,1); return x; }
function breakRange(sh){
  const c=D.cfg; if(sh.sinBreak) return null;
  const [a,b]=bounds(sh); const bm=c.breakMin*60000;
  let s,e;
  if(sh.bi && sh.bv){ s=place(sh,sh.bi,a); e=place(sh,sh.bv,a); if(e<=s) e=new Date(e.getTime()+864e5); }
  else if(sh.bi){ s=place(sh,sh.bi,a); e=new Date(s.getTime()+bm); }
  else if(sh.bv){ e=place(sh,sh.bv,a); s=new Date(e.getTime()-bm); }
  else {
    const net=(b-a)-bm; if(net<=0) return null;
    s=new Date(a.getTime()+Math.round(net/2/60000)*60000);
    if(sh.s===c.cierre){ const mid=dt(ymd(b),'00:00'); if(mid>a && s.getTime()+bm>mid.getTime()) s=new Date(Math.max(a.getTime(),mid.getTime()-bm)); }
    e=new Date(s.getTime()+bm);
    return {s,e,est:true};
  }
  return {s,e,est:false};
}
function extraRange(sh){
  const [a,b]=bounds(sh);
  if(sh.extra==='todo') return [a,b];
  if(sh.extra==='parte' && sh.xd && sh.xh){ const s=place(sh,sh.xd,a); let e=place(sh,sh.xh,a); if(e<=s) e=new Date(e.getTime()+864e5); return [s,e]; }
  return null;
}
function minuteKinds(sh, fer){
  // devuelve [{t, kind}] por cada minuto del turno (incluye break como 'brk')
  const c=D.cfg, [a,b]=bounds(sh), br=breakRange(sh), ex=extraRange(sh), ni=toMin(c.nIni), nf=toMin(c.nFin), out=[];
  for(let t=a.getTime(); t<b.getTime(); t+=60000){
    if(br && t>=br.s.getTime() && t<br.e.getTime()){ out.push({t,brk:true}); continue; }
    const d=new Date(t), m=d.getHours()*60+d.getMinutes();
    const night = ni>nf ? (m>=ni||m<nf) : (m>=ni&&m<nf);
    const dom = d.getDay()===0 || fer.has(ymd(d));
    const extra = !!(ex && t>=ex[0].getTime() && t<ex[1].getTime());
    out.push({t,night,dom,extra});
  }

}
function tally(shifts, cutoff, fer){
  const T={base:0,extra:0,noct:0,dom:0,noctDom:0,tot:0}, c=D.cfg;
  shifts.forEach(sh=>{ if(sh.lic) return;
    minuteKinds(sh,fer).forEach(k=>{ if(k.brk || k.t>=cutoff) return;
      T.tot++;
      if(k.extra){ T.extra++; if(!c.extraSuma) return; } else T.base++;
      if(k.dom){ T.dom++; if(k.night) T.noctDom++; } else if(k.night) T.noct++;

}
function payroll(T, haberes, pres){
  const c=D.cfg, V=c.valorHora, r=Math.round;
  const P={T, hBase:hrs(T.base), hExtra:hrs(T.extra), hNoct:hrs(T.noct), hDom:hrs(T.dom), hNoctDom:hrs(T.noctDom), hTot:hrs(T.tot)};
  P.base=r(P.hBase*V); P.extra=r(P.hExtra*V*(1+c.rExtra/100)); P.noct=r(P.hNoct*V*c.rNoct/100);
  P.dom=r(P.hDom*V*c.rDom/100); P.noctDom=r(P.hNoctDom*V*c.rNoctDom/100);
  P.habImp=haberes.filter(h=>h.imp); P.habNo=haberes.filter(h=>!h.imp);
  const sImp=P.habImp.reduce((s,h)=>s+h.monto,0), sNo=P.habNo.reduce((s,h)=>s+h.monto,0);
  const pre=P.base+P.extra+P.noct+P.dom+P.noctDom+sImp;
  P.topeGrat=r(4.75*c.imm/12);
  P.grat = c.gratOn ? Math.min(r(pre*c.gratPct/100), P.topeGrat) : 0;
  P.imp=pre+P.grat;
  P.mov = pres ? r(P.base*c.presPct/100) : 0;
  P.noimp=P.mov+sNo;

  P.desc=P.afp+P.sal+P.ces; P.totHab=P.imp+P.noimp; P.trib=P.imp-P.desc; P.liq=P.totHab-P.desc;
  return P;
}

  const hab=haberesOf(ym), pres=opts.pres!==undefined?opts.pres:presOf(ym);
  const total=payroll(tally(all,Infinity,fer),hab,pres);
  const started = dt(ym+'-01')<=now;
  const ganado = started ? payroll(tally(all,now.getTime(),fer),hab,pres) : payroll(tally([],0,fer),[],false);
  const work=all.filter(s=>!s.lic);
  return { ym, total, ganado, agendado: total.liq-ganado.liq, nG:work.filter(s=>statusOf(s,now)==='G').length,
    nA:work.filter(s=>statusOf(s,now)!=='G').length, n:work.length };

function weekStart(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
function validate(sh){
  const err=[], warn=[];
  if(!sh.f||!sh.e||!sh.s){ err.push('Completa fecha, entrada y salida.'); return {err,warn}; }
  if(sh.e===sh.s){ err.push('La entrada y la salida no pueden ser iguales.'); return {err,warn}; }
  const [a,b]=bounds(sh), dur=(b-a)/36e5;
  if(dur>12) warn.push('Este turno dura '+fh(dur)+'. Revisa que las horas estén bien.');
  if(!sh.sinBreak && (sh.bi||sh.bv)){
    const br=breakRange(sh);
    if(br.s<a || br.e>b) err.push('El break queda fuera del horario del turno.');
    else if((br.e-br.s)/6e4>120) warn.push('El break dura más de 2 horas.');
  }
  if(sh.extra==='parte'){
    if(!sh.xd||!sh.xh) err.push('Indica desde y hasta qué hora fue extra.');
    else { const x=extraRange(sh); if(x[0]<a||x[1]>b) err.push('El tramo extra queda fuera del turno.'); }
  }
  D.shifts.forEach(o=>{ if(o.id===sh.id) return; const [oa,ob]=bounds(o); if(a<ob && oa<b) err.push('Se cruza con tu turno del '+labelDia(oa)+' ('+o.e+' → '+o.s+').'); });
  const fer=feriadoMap();
  [ymd(a),ymd(new Date(b.getTime()-6e4))].filter((v,i,x)=>x.indexOf(v)===i).forEach(f=>{
    const h=fer.get(f); if(!h||!h.irr) return;

    warn.push(antes ? h.n+' es feriado irrenunciable y ya lo trabajaste el año pasado. No corresponde trabajarlo dos años seguidos.' : h.n+' es feriado irrenunciable.');
  });
  return {err,warn};
}

function previewShift(){
  const d=UI.sheet.d, box=document.getElementById('sf-prev'), btn=document.getElementById('sf-save'), nx=document.getElementById('sf-next');

  if(nx) nx.textContent = (d.e&&d.s&&d.s<=d.e)?'· día siguiente':'';
  const v=validate(d); btn.disabled=v.err.length>0;
  let h=v.err.map(e=>`<div class="note err">${I.info}<span>${esc(e)}</span></div>`).join('')+v.warn.map(e=>`<div class="note warn">${I.info}<span>${esc(e)}</span></div>`).join('');
  if(!v.err.length && d.lic) h+=`<div class="note">${I.info}<span>Queda registrado como licencia. No suma horas ni dinero; el subsidio de la licencia lo paga tu sistema de salud aparte.</span></div>`;
  if(!v.err.length && !d.lic){
    const fer=feriadoMap(), ks=minuteKinds(d,fer), segs=[]; const cat=k=>k.brk?'brk':(k.extra?'x':(k.dom&&k.night?'nd':(k.dom?'d':(k.night?'n':'base'))));
    ks.forEach(k=>{ const c=cat(k); if(segs.length&&segs[segs.length-1].c===c) segs[segs.length-1].n++; else segs.push({c,n:1}); });
    const cnt={}; ks.forEach(k=>{ const c=cat(k); cnt[c]=(cnt[c]||0)+1; });
    const br=breakRange(d), [a,b]=bounds(d), c=D.cfg;
    const lg=[['base','Hora normal',''],['n','Nocturno','+'+c.rNoct+'%'],['d','Domingo o festivo','+'+c.rDom+'%'],['nd','Domingo o festivo de noche','+'+c.rDom+'% +'+c.rNoctDom+'%'],['x','Hora extra','+'+c.rExtra+'%']]
      .filter(x=>cnt[x[0]]).map(([k,l,p])=>`<div class="lg"><span class="row gap8"><i class="k-${k}" style="background:var(--seg-${k})"></i>${l} <span class="muted">${p}</span></span><span class="num">${fh(hrs(cnt[k]))}</span></div>`).join('');
    const ym=d.f.slice(0,7), con=monthData(ym,null,{sin:d.id,mas:d}).total.liq, sin=monthData(ym,null,{sin:d.id}).total.liq;
    h+=`<div class="card pad col gap10"><div class="row between"><span class="label">Así se pagará</span><span class="small muted">${fh(hrs(ks.filter(k=>!k.brk).length))} netas</span></div>
      <div class="tl" aria-hidden="true">${segs.map(s=>`<span class="k-${s.c}" style="width:${s.n/ks.length*100}%"></span>`).join('')}</div>
      <div class="row between xs muted num"><span>${hm(a)}</span><span>${br?'break '+hm(br.s)+(br.est?' (estimado)':''):'sin break'}</span><span>${hm(b)}</span></div>
      <div class="col gap6">${lg}</div>
      <div class="row between" style="border-top:1px solid var(--surf2);padding-top:8px"><span class="col" style="gap:2px"><span class="small muted">Suma a tu líquido</span><span class="xs muted">Aprox. · cada minuto cuenta</span></span>
      <span class="num c-green" style="font-size:17px;font-weight:600">+${money(con-sin)}</span></div></div>`;
  }
  box.innerHTML=h;
}
function sheetAviso(){
  return `<div class="scrim" data-a="closeScrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Por qué es aproximado">
    <div class="row between"><h2 style="font-size:18px">Por qué es aproximado</h2><button class="icon-btn" style="width:44px;height:44px" data-a="close" aria-label="Cerrar">${I.x}</button></div>
    <p>Sueldito calcula con los turnos que tú registras y con las reglas de tu configuración. El monto real puede variar porque:</p>
    <div class="card pad col gap8"><span>• Tu empleador paga según tus marcas reales. Entrar o salir unos minutos antes o después cambia las horas.</span><span>• Un break más largo o en otro horario cambia cuántos minutos llevan recargo.</span><span>• Pueden existir bonos, descuentos o ajustes que no están registrados aquí.</span></div>
    <p class="muted">Úsalo como referencia para ordenar tus finanzas. Tu liquidación oficial es la que vale.</p>
    <button class="btn" data-a="close">Entendido</button></div></div>`;
}

/* ================= Render ================= */
function applyTheme(){ const r=document.documentElement; if(D.cfg.tema==='auto'){ if(r.dataset.themeBy==='app'){ delete r.dataset.theme; delete r.dataset.themeBy; } } else { r.dataset.theme=D.cfg.tema; r.dataset.themeBy='app'; } }
function render(){
  const app=document.getElementById('app'), sc=app.querySelector('main') ? app.querySelector('main').scrollTop : 0;
  if(UI.step==='welcome'){ app.innerHTML=vWelcome(); }
  else if(UI.step==='config'){ app.innerHTML=vConfig(); }
  else {
    const body={resumen:vResumen,turnos:vTurnos,liq:vLiq,ajustes:vAjustes}[UI.tab]();
    const tabs=[['resumen','Resumen',I.pulse],['turnos','Turnos',I.cal],['liq','Liquidación',I.doc],['ajustes','Ajustes',I.gear]];
    app.innerHTML=`<main id="main">${body}</main>${UI.tab==='turnos'?`<button class="fab" data-a="nuevo">${I.plus}Agregar turno</button>`:''}
      <nav class="tabs" aria-label="Secciones">${tabs.map(([k,l,ic])=>`<button data-a="tab" data-t="${k}" ${UI.tab===k?'aria-current="page"':''}>${ic}${l}</button>`).join('')}</nav>`;
    const m=app.querySelector('main'); if(m && !UI.resetScroll) m.scrollTop=sc; UI.resetScroll=false;
    bindSwipes(); runAnim();
  }
  renderSheet(); renderToast();
}
function renderSheet(){
  const el=document.getElementById('sheet');
  el.innerHTML = !UI.sheet ? '' : (UI.sheet.type==='shift' ? sheetShift() : sheetAviso());
  if(UI.sheet && UI.sheet.type==='shift') previewShift();
}
function renderToast(){
  const el=document.getElementById('toast');
  el.innerHTML = UI.toast ? `<div class="toast" role="status"><span>${esc(UI.toast.msg)}</span>${UI.toast.undo?'<button data-a="undo">Deshacer</button>':''}</div>` : '';
}
let toastT=null;
function toast(msg, undo){ UI.toast={msg,undo}; renderToast(); clearTimeout(toastT); toastT=setTimeout(()=>{ UI.toast=null; renderToast(); }, undo?6000:3200); }
function runAnim(){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const els=[...document.querySelectorAll('[data-count]')], bars=[...document.querySelectorAll('.bar [data-w]')];
  if(!UI.animate || reduce){ bars.forEach(b=>b.style.width=b.dataset.w+'%'); UI.animate=false; UI.fromG=null; return; }
  UI.animate=false; UI.fromG=null;
  requestAnimationFrame(()=>bars.forEach(b=>b.style.width=b.dataset.w+'%'));
  const t0=performance.now(), dur=700;
  els.forEach(e=>e.setAttribute('aria-label',e.textContent));
  (function step(t){ const x=Math.min(1,(t-t0)/dur), p=1-Math.pow(1-x,3);
    els.forEach(e=>{ if(!e.isConnected) return; const to=Number(e.dataset.count), from=Number(e.dataset.from||0); e.textContent=money(from+(to-from)*p); });
    if(x<1) requestAnimationFrame(step); })(t0);
}
function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('div'); c.className='confetti'; const cols=['#5BE0A6','#B79CFF','#6A3DD1','#0B7F57'];
  for(let i=0;i<44;i++){ const p=document.createElement('i'); p.style.left=Math.random()*100+'%'; p.style.background=cols[i%4]; p.style.animationDelay=(Math.random()*.35)+'s'; p.style.transform='rotate('+Math.random()*90+'deg)'; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(()=>c.remove(),1700);
}

/* ================= Gestos ================= */
function bindSwipes(){
  document.querySelectorAll('.swipe').forEach(w=>{
    const row=w.querySelector('.trow'); let x0=null,y0=0,dx=0,lock=null;
    row.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; lock=null; },{passive:true});
    row.addEventListener('touchmove',e=>{ if(x0===null) return; const ax=e.touches[0].clientX-x0, ay=e.touches[0].clientY-y0;
      if(lock===null && (Math.abs(ax)>8||Math.abs(ay)>8)) lock=Math.abs(ax)>Math.abs(ay)?'x':'y';
      if(lock!=='x') return; dx=Math.max(-110,Math.min(110,ax)); row.classList.add('drag'); row.style.transform='translateX('+dx+'px)'; },{passive:true});
    row.addEventListener('touchend',()=>{ row.classList.remove('drag'); row.style.transform=''; const id=w.dataset.id;
      if(lock==='x'){ row.dataset.swiped='1'; setTimeout(()=>delete row.dataset.swiped,350); if(dx>70) openEdit(id); else if(dx<-70) delShift(id); }
      x0=null; });
  });
}

/* ================= Acciones ================= */
function openNew(f){
  const base=f||(UI.ym===ymOf(NOW())?ymd(NOW()):UI.ym+'-01');
  UI.sheet={type:'shift',edit:false,d:{id:uid(),f:base,e:'',s:'',bi:'',bv:'',sinBreak:false,extra:'no',xd:'',xh:'',lic:false}}; renderSheet();
}
function openEdit(id){ const s=D.shifts.find(x=>x.id===id); if(!s) return; UI.sheet={type:'shift',edit:true,d:{...s}}; renderSheet(); }
let lastDeleted=null;
function delShift(id){ const i=D.shifts.findIndex(x=>x.id===id); if(i<0) return; lastDeleted=D.shifts[i]; D.shifts.splice(i,1); save(); UI.sheet=null; render(); toast('Turno borrado',true); }
function ejemplo(){
  const now=NOW(), y=now.getFullYear(), m=now.getMonth(), days=new Date(y,m+1,0).getDate(), out=[]; let w=0;
  for(let d=1;d<=days;d++){ const x=new Date(y,m,d), wd=x.getDay(), f=ymd(x);
    if(wd===1) w++;
    const add=(e,s)=>out.push({id:uid(),f,e,s,bi:'',bv:'',sinBreak:false,extra:'no',xd:'',xh:'',lic:false,demo:true});
    if(w%3===2){ if(wd===3) add('19:00','02:00'); if(wd===4) add('17:30','00:00'); if(wd===6) add('23:00','07:00'); }
    else { if(wd===2) add('23:00','07:00'); if(wd===3) add('19:00','02:00'); if(wd===4) add('17:30','00:00'); }
  }
  D.shifts=D.shifts.filter(s=>!s.demo && s.f.slice(0,7)!==ymOf(now)).concat(out);
  if(!D.haberes.some(h=>h.demo)) D.haberes.push({id:uid(),nombre:'Beca (ejemplo)',monto:75000,imp:true,tipo:'mensual',demo:true});
  D.ejemplo=true; save();
}
function act(a, el, ev){
  const ds=el.dataset;
  switch(a){
    case 'tab': UI.tab=ds.t; UI.animate=ds.t==='resumen'; UI.resetScroll=true; UI.confirmBorrar=false; render(); break;
    case 'mes': { let [y,m]=UI.ym.split('-').map(Number); m+=Number(ds.d); if(m<1){m=12;y--;} if(m>12){m=1;y++;} UI.ym=y+'-'+pad(m); UI.animate=UI.tab==='resumen'; UI.selDay=null; render(); break; }
    case 'vista': UI.vista=ds.v; render(); break;
    case 'dia': UI.selDay=ds.f; render(); break;
    case 'modo': UI.modo=ds.m; render(); break;
    case 'pres': D.pres[UI.ym]=el.checked; save(); UI.animate=false; render(); break;
    case 'aviso': UI.sheet={type:'aviso'}; renderSheet(); break;
    case 'nuevo': openNew(ds.f); break;
    case 'edit': if(el.dataset.swiped) break; openEdit(ds.id); break;
    case 'close': UI.sheet=null; renderSheet(); break;
    case 'closeScrim': if(ev.target===el){ UI.sheet=null; renderSheet(); } break;
    case 'sfExtra': UI.sheet.d.extra=ds.v; renderSheet(); break;
    case 'sfSave': { const d=UI.sheet.d; if(validate(d).err.length) break; const cl={...d}; delete cl.demo; if(cl.lic) cl.extra='no';
      const i=D.shifts.findIndex(x=>x.id===d.id); if(i>=0) D.shifts[i]=cl; else D.shifts.push(cl);
      save(); UI.ym=d.f.slice(0,7); UI.selDay=d.f; UI.sheet=null; UI.animate=UI.tab==='resumen'; render(); toast(i>=0?'Turno actualizado':'Turno guardado'); break; }
    case 'sfDel': delShift(UI.sheet.d.id); break;
    case 'undo': if(lastDeleted){ D.shifts.push(lastDeleted); lastDeleted=null; save(); UI.toast=null; render(); } break;
    case 'tema': D.cfg.tema=ds.v; save(); applyTheme(); render(); break;
    case 'habForm': UI.habForm=true; render(); break;
    case 'habCancel': UI.habForm=false; render(); break;
    case 'habSave': { const n=document.getElementById('hb-n').value.trim(), m=Number(document.getElementById('hb-m').value), t=document.getElementById('hb-t').value;
      if(!n||!(m>0)){ toast('Escribe un nombre y un monto mayor que cero.'); break; }
      D.haberes.push({id:uid(),nombre:n,monto:Math.round(m),imp:document.getElementById('hb-i').checked,tipo:t,mes:t==='mes'?UI.ym:undefined}); save(); UI.habForm=false; render(); toast('Haber agregado'); break; }
    case 'delHaber': D.haberes=D.haberes.filter(h=>h.id!==ds.id); save(); render(); break;
    case 'verFer': UI.verFer=!UI.verFer; render(); break;
    case 'ferToggle': if(el.checked) D.ferOff=D.ferOff.filter(f=>f!==ds.f); else if(!D.ferOff.includes(ds.f)) D.ferOff.push(ds.f); save(); render(); break;
    case 'ferAdd': { const f=document.getElementById('fer-new').value; if(!f){ toast('Elige una fecha.'); break; } if(!D.ferExtra.some(x=>x.f===f)) D.ferExtra.push({f}); save(); render(); break; }
    case 'ferDel': D.ferExtra=D.ferExtra.filter(x=>x.f!==ds.f); save(); render(); break;
    case 'ejemplo': ejemplo(); UI.ym=ymOf(NOW()); UI.tab='resumen'; UI.animate=true; UI.resetScroll=true; render(); toast('Turnos de ejemplo cargados'); break;
    case 'borrarEjemplo': D.shifts=D.shifts.filter(s=>!s.demo); D.haberes=D.haberes.filter(h=>!h.demo); D.ejemplo=false; save(); UI.animate=true; render(); break;
    case 'borrar': UI.confirmBorrar=true; render(); break;
    case 'borrarNo': UI.confirmBorrar=false; render(); break;
    case 'borrarSi': D={v:1,onboarded:false,cfg:{...CFG0,tema:D.cfg.tema},shifts:[],pres:{},haberes:[],ferOff:[],ferExtra:[],lastSeen:Date.now(),ejemplo:false}; save(); UI.confirmBorrar=false; UI.step='welcome'; UI.tab='resumen'; render(); break;
    case 'goConfig': UI.cfgDraft={...D.cfg}; UI.step='config'; render(); break;
    case 'demo': D.onboarded=true; ejemplo(); UI.step=null; UI.animate=true; render(); break;
    case 'obSet': readOb(); UI.cfgDraft[ds.k]=ds.v; if(ds.k==='afp'){ const p=AFPS.find(x=>x[0]===ds.v); UI.cfgDraft.afpPct=Math.round((10+p[1])*100)/100; } render(); break;
    case 'obDone': { readOb(); const c=UI.cfgDraft; if(!(c.valorHora>0)||!(c.horasSem>0)){ toast('Indica tu valor hora y tus horas semanales.'); break; }
      D.cfg={...c}; D.onboarded=true; save(); UI.step=null; UI.tab='turnos'; render(); toast('Listo. Agrega tu primer turno.'); break; }
  }
}
function readOb(){ const a=document.getElementById('ob-vh'), b=document.getElementById('ob-hs'); if(a) UI.cfgDraft.valorHora=Number(a.value)||0; if(b) UI.cfgDraft.horasSem=Number(b.value)||0; }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.tagName==='INPUT' && el.type!=='checkbox' && el.type!=='radio') return;
  act(el.dataset.a, el, e);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f && UI.sheet && UI.sheet.type==='shift'){
    UI.sheet.d[el.dataset.f] = el.type==='checkbox' ? el.checked : el.value;
    if(el.dataset.f==='sinBreak'){ document.getElementById('sf-brk').hidden=el.checked; }
    previewShift();
  }
});
document.addEventListener('change',e=>{
  const el=e.target, k=el.dataset.cfg; if(!k) return;
  let v = el.type==='checkbox' ? el.checked : (el.type==='number' ? Number(el.value) : el.value);
  if(el.type==='number' && !(v>=0)) v=CFG0[k];
  if(el.type==='time' && !v) v=CFG0[k];
  D.cfg[k]=v;
  if(k==='afp'){ const p=AFPS.find(x=>x[0]===v); D.cfg.afpPct=Math.round((10+p[1])*100)/100; }
  if(k==='salud' && v==='fonasa') D.cfg.saludPct=7;
  save(); render();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && UI.sheet){ UI.sheet=null; renderSheet(); } });

/* ================= Arranque ================= */
function boot(){
  applyTheme();
  const now=NOW(), last=D.lastSeen||0;
  if(D.onboarded && last){
    const fer=feriadoMap();
    const just=D.shifts.filter(s=>{ if(s.lic) return false; const b=bounds(s)[1].getTime(); return b>last && b<=now.getTime(); });
    if(just.length){
      UI.earned=just.map(s=>s.id);
      UI.fromG=monthData(UI.ym,new Date(last)).ganado.liq;
      setTimeout(()=>toast(just.length===1?'1 turno pasó a Ganado':just.length+' turnos pasaron a Ganado'),400);
      const hs=D.cfg.horasSem;
      const completo=just.some(s=>{ const k=ymd(weekStart(bounds(s)[0])); const ws=D.shifts.filter(o=>ymd(weekStart(bounds(o)[0]))===k);
        return weekStats(ws,now,fer).g>=hs && weekStats(ws,new Date(last),fer).g<hs; });
      if(completo) setTimeout(confetti,700);
      setTimeout(()=>{ UI.earned=[]; },2500);
    }
  }
  D.lastSeen=now.getTime(); save();
  render();
  setInterval(()=>{ if(UI.sheet||UI.step) return; const ae=document.activeElement; if(ae && /INPUT|SELECT/.test(ae.tagName)) return;
    const n=NOW(), l=D.lastSeen; const just=D.shifts.filter(s=>{ if(s.lic) return false; const b=bounds(s)[1].getTime(); return b>l && b<=n.getTime(); });
    if(just.length){ UI.earned=just.map(s=>s.id); UI.fromG=monthData(UI.ym,new Date(l)).ganado.liq; UI.animate=true; toast('Un turno pasó a Ganado'); setTimeout(()=>{UI.earned=[];},2500); }
    D.lastSeen=n.getTime(); save(); render(); }, 60000);
}
if(typeof document!=='undefined' && document.getElementById('app')) boot();
</script>
